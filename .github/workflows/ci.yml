name: CI
on:
  push:
    branches: [main, "release-*"]
  pull_request:
permissions:
  contents: read
jobs:
  # A push or pull request that changes only docs/ runs lint alone; build, test, contract and
  # package report as skipped. Anything it cannot classify runs every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A forced push, a new branch (an all-zero before) or a base this clone does not
          # have leaves base empty, which runs everything.
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && [ "$FORCED" != true ]; then
            base=$BEFORE
          fi
          code=true
          if [ -n "$base" ] && [ -n "${base//0/}" ] \
            && git merge-base --is-ancestor "$base" HEAD 2>/dev/null \
            && paths=$(git diff --name-only --no-renames "$base" HEAD) \
            && [ -n "$paths" ] && ! grep -qv '^docs/' <<<"$paths"; then
            code=false
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "changed paths outside docs/: $code"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tests/contract ci --ignore-scripts --no-audit --no-fund
      - name: Types and lint
        run: npm run check && npm run lint:node && npm run lint:markdown
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm run build && npm test
  contract:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Contracts include timed observer waits alongside installs and builds; at 30 minutes a
    # contract run has hung rather than finished normally.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tests/contract ci --ignore-scripts --no-audit --no-fund
      - name: Contracts
        run: npm run contract
  package:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect the package
        run: npm run build && npm run package:check
      # The exact-commit host controller starts its own offline release container, which
      # reads the npm cache volume filled here from the lockfile.
      - name: Build the npm release asset offline
        run: |
          docker run --rm --memory 4g --user 19001:19001 --env HOME=/tmp \
            --mount type=volume,src=delivery-kit-npm-check,dst=/var/tmp \
            --mount type=bind,src="$PWD",dst=/source,readonly \
            "node:$(sed 's/^v//' .nvmrc)" sh -ec \
            'limit=/sys/fs/cgroup/memory.max
              if [ ! -r "$limit" ]; then limit=/sys/fs/cgroup/memory/memory.limit_in_bytes; fi
              bytes=$(cat "$limit")
              printf "Release cache-seed memory limit: %s bytes\n" "$bytes"
              test "$bytes" = 4294967296
              cp /source/package.json /source/package-lock.json /tmp
              cd /tmp
              npm ci --ignore-scripts --no-audit --no-fund --cache /var/tmp/npm'
          npm run pack -- "$GITHUB_SHA" "$RUNNER_TEMP/release"
