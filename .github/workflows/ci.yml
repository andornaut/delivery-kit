name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # Offline contracts include timed observer waits alongside installs, builds
    # and packaging; at 30 minutes a check has hung rather than finished normally.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      # -x follows a `source` into the file it names and -P SCRIPTDIR looks for
      # it beside the script doing the sourcing, which shellcheck cannot resolve
      # on its own. Set everywhere rather than only where something sources
      # today, so a script that starts to is already covered.
      #
      # node_modules is skipped because a Lint job that installs dependencies
      # would otherwise answer for shell a dependency ships.
      - name: Run ShellCheck
        # Followed at the commit rather than at the 2.0.0 tag, which is the newest
        # the action has: it has had no release since 2023, so nothing upstream
        # would notice the tag being moved. The tag is named beside the sha so a
        # reader can tell which release this is.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          # Pinned rather than the action's `stable` default, which names a
          # moving release the action downloads at run time: without this a
          # ShellCheck release turns every one of these gates red on a commit
          # that did not touch them. Dependabot does not read an action input,
          # so this moves by hand.
          version: v0.11.0
          # Dependencies and local worktree copies are outside this source tree.
          ignore_paths: node_modules .worktrees
          scandir: "."
      - name: Prepare verification image
        run: docker pull "node:$(sed 's/^v//' .nvmrc)"
      - name: Isolated offline checks and package validation
        run: npm run verify
      - name: Build the npm release asset offline
        run: npm run pack -- "$GITHUB_SHA" "$RUNNER_TEMP/release"
