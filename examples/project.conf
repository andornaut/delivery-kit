# Trusted Bash configuration, supplied by the project operator.
REPO=/absolute/path/to/project
MAIN=main
REMOTE=origin
GH_SLUG=owner/project
DEPARTURES="00"
BUS_TIMEZONE=America/Toronto
DEPLOY_SKIP_RE='\.md$'
NODE_IMAGE=node:24.21.0
CONTAINER_PREFIX=project-
CPUS=4
MAX_WORKERS=4
LOAD_LIMIT=24
GATE_INSTALL='npm ci'
GATE_STEPS=("check|npm run check" "lint|npm run lint" "test|npm test -- --maxWorkers=4" "build|npm run build")
DEPLOY_MODE=wrangler
CI_REQUIRED_NAMES='Lint|Test'
MONITOR_MINUTES='20 50'
MONITOR_ROUTE_FILE=/absolute/path/to/monitor-route.json
# Optional scheduled worker inspection: whitespace-separated canonical parent UUIDs.
# Select only the active route's monitor UUID or active targets, independent of dispatch host.
# A nonempty list requires a valid active MONITOR_ROUTE_FILE. No parents are inferred.
# One-off monitor-snapshot uses explicit repeatable --parent flags instead.
WORKER_PARENT_THREADS=''
# Optional owner-maintained process registration and evidence manifest. Unset skips inspection.
# Validated only at the process-health boundary; the monitor never edits this file.
# PROCESS_HEALTH_FILE=/absolute/path/to/process-health.json
REPORT_PROJECT=Project
# Routed mode: set REPORT_THREAD to the confirmed monitor UUID.
# Keep Tech UUID/role maps unchanged; do not relabel Tech as monitor.
# Tech retains implementation/integration and exact-pin approval.
# Monitor operations require confirmed idle adoption, drained reporters and activation.
# Source Tech retains runtime ownership until then.
# Unset route mode also uses this for legacy triage.
# Resident processes do not reload this value; use the documented idle cutover.
# Reconcile detached CI watchers/flushers and unsent events before transfer.
REPORT_THREAD=
# Native coordinator triage is optional and fail-closed without valid explicit metadata.
CODEX_PYTHON=/usr/bin/python3
CODEX_CONTROL_SOCKET=/absolute/path/to/codex-control.sock
CODEX_SHARED_ROLES='art-kit delivery-kit game-kit'
SESSION_MAP_FILE=/absolute/path/to/project-session-map.json
SHARED_TARGETS_FILE=/absolute/path/to/project-shared-targets.json
REPORT_SCHEDULED_TICKS=1
