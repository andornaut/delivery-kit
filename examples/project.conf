# Trusted Bash configuration, supplied by the project operator.
REPO=/absolute/path/to/project
MAIN=main
REMOTE=origin
GH_SLUG=owner/project
DEPARTURES="00"
BUS_TIMEZONE=America/Toronto
DEPLOY_SKIP_RE='\.md$'
NODE_IMAGE=node:24.21.0
CONTAINER_PREFIX=project-
CPUS=4
MAX_WORKERS=4
LOAD_LIMIT=24
GATE_INSTALL='npm ci'
GATE_STEPS=("check|npm run check" "lint|npm run lint" "test|npm test -- --maxWorkers=4" "build|npm run build")
DEPLOY_MODE=wrangler
CI_REQUIRED_NAMES='Lint|Test'
MONITOR_MINUTES='20 50'
MONITOR_ROUTE_FILE=/absolute/path/to/monitor-route.json
REPORT_PROJECT=Project
# Independent bus-event recipient, for example the confirmed operational monitor.
# Tech retains approval ownership. Unset route mode also uses this for legacy triage.
# Resident processes do not reload this value; use the documented idle cutover.
# Reconcile detached CI watchers/flushers and unsent events before transfer.
REPORT_THREAD=
# Native coordinator triage is optional and fail-closed without valid explicit metadata.
CODEX_PYTHON=/usr/bin/python3
CODEX_CONTROL_SOCKET=/absolute/path/to/codex-control.sock
CODEX_SHARED_ROLES='art-kit delivery-kit game-kit'
SESSION_MAP_FILE=/absolute/path/to/project-session-map.json
SHARED_TARGETS_FILE=/absolute/path/to/project-shared-targets.json
REPORT_SCHEDULED_TICKS=1
